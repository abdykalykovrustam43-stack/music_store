<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <title>Music Store</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            margin: 40px;
            background-color: #f5f5f5;
        }


        h1 {
            text-align: center;
        }


        .search {
            text-align: center;
            margin-bottom: 30px;
        }


        input {
            padding: 10px;
            width: 250px;
            border-radius: 5px;
            border: 1px solid gray;
        }


        button {
            padding: 10px 15px;
            border-radius: 5px;
            border: none;
            cursor: pointer;
            background: black;
            color: white;
        }


        .products {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
        }


        .card {
            background: white;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
        }


        .image {
            font-size: 50px;
        }


        .price {
            font-weight: bold;
        }


    </style>

</head>


<body>


<h1>🎵 Music Store</h1>


<div class="search">

    <form method="GET">

        <input
            type="text"
            name="search"
            placeholder="Поиск музыки..."
        >

        <button type="submit">
            🔍 Найти
        </button>

    </form>

</div>



<div class="products">


{% for sound in sounds %}


<div class="card">


    <div class="image">
        🎵
    </div>


    <h2>
        {{ sound.title }}
    </h2>


    <p>
        Исполнитель: {{ sound.artist }}
    </p>


    <p>
        Жанр: {{ sound.genre }}
    </p>


    <p class="price">
        {{ sound.price }} сом
    </p>


    <button>
        Купить
    </button>


</div>


{% empty %}


<p>
    Ничего не найдено 😢
</p>


{% endfor %}


</div>



</body>

</html>
